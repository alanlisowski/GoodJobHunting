name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: dummy
      CAPTURE_TOKEN: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
