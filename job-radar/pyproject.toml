[project]
name = "job-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.47",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
